version: 2

models:
  - name: gold_ndc_billing_crosswalk
    description: "A highly optimized view joining Package -> Product. Exposes ndc_11_digit (unhyphenated) as the primary indexing column to allow seamless joining against pharmacy claims datasets and pricing feeds."
    columns:
      - name: package_coreason_id
        description: "Shift-left UUID for the package."
      - name: product_coreason_id
        description: "Shift-left UUID for the product."
      - name: product_id
        description: "Foreign Key to Silver.NDC_Product"
      - name: ndc_package_code
        description: "FDA 10-digit package code"
      - name: package_description
        description: "Commercial packaging details mapped to the product."
      - name: product_ndc
        description: "Base 10-digit product code"
      - name: proprietary_name
        description: "Trade name"
      - name: non_proprietary_name
        description: "Generic name / Active Ingredient"
      - name: labeler_name
        description: "Manufacturer/Distributor"
      - name: dosage_form
        description: "Dosage form"
      - name: route
        description: "Route"
      - name: marketing_start_date
        description: "Parsed to ISO 8601 (YYYYMMDD -> Date)"
      - name: ndc_11_digit
        description: "Unhyphenated 11-digit billing format (5-4-2)"
