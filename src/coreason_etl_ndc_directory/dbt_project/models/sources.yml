version: 2

sources:
  - name: fda_ndc_directory
    schema: bronze
    description: "Raw data landed by dlt from the FDA NDC Directory zip file."
    tables:
      - name: coreason_etl_ndc_directory_bronze_ndc_product_raw
        description: "Bronze table containing the raw product rows."
        columns:
          - name: coreason_id
            description: "Shift-left UUID generated from PRODUCTID."
          - name: source_file
            description: "The name of the source text file."
          - name: ingestion_ts
            description: "The timestamp of when the row was ingested."
          - name: content_hash
            description: "MD5 hash of the row content."
          - name: raw_data
            description: "JSONB column containing the raw tab-delimited fields."

      - name: coreason_etl_ndc_directory_bronze_ndc_package_raw
        description: "Bronze table containing the raw package rows."
        columns:
          - name: coreason_id
            description: "Shift-left UUID generated from NDCPACKAGECODE."
          - name: source_file
            description: "The name of the source text file."
          - name: ingestion_ts
            description: "The timestamp of when the row was ingested."
          - name: content_hash
            description: "MD5 hash of the row content."
          - name: raw_data
            description: "JSONB column containing the raw tab-delimited fields."
